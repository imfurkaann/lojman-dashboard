services:
  app:
    build: .
    container_name: lojman-dashboard
    ports:
      - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/lojman.db
      TZ: Europe/Istanbul
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - lojman-db-volume:/data
      - uploads-volume:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  lojman-db-volume:
    driver: local
  uploads-volume:
    driver: local
