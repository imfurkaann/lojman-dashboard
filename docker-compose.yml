services:
  app:
    build: .
    container_name: lojman-dashboard
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/lojman.db
    volumes:
      - lojman-db-volume:/data
      - uploads-volume:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  lojman-db-volume:
    driver: local
  uploads-volume:
    driver: local
