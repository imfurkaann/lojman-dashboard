services:
  app:
    build: .
    container_name: lojman-dashboard
    # Do not publish app port directly in production; nginx will proxy TLS
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/lojman.db
      TZ: Europe/Istanbul
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - lojman-db-volume:/data
      - uploads-volume:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  nginx:
    image: nginx:stable-alpine
    container_name: lojman-nginx
    depends_on:
      - app
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  lojman-db-volume:
    driver: local
  uploads-volume:
    driver: local
