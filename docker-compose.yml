services:
  app:
    build: .
    container_name: lojman-dashboard
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/lojman.db
      TZ: Europe/Istanbul
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ./data:/data
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

# Using bind mounts to keep DB and uploads on the host filesystem.
# Volumes removed: switched to host folders under the project directory.
